spring.application.name=demo

supabase.url=${SUPABASE_URL}
supabase.publishable-key=${SUPABASE_PUBLISHABLE_KEY}
supabase.secret-key=${SUPABASE_SECRET_KEY}
supabase.jwks-url=${SUPABASE_JWKS_URL}

# Validación de los JWT de Supabase Auth (ver Config/SeguridadConfig).
# - jwk-set-uri: de dónde bajar las llaves PÚBLICAS para verificar la firma.
# - jws-algorithms: Supabase firma con ES256; el valor por defecto de Spring es
#   RS256 y rechazaría todos los tokens.
# - issuer-uri: el token debe decir que lo emitió NUESTRO proyecto de Supabase.
# - audiences: Supabase pone aud=authenticated en los tokens de usuarios logueados.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_JWKS_URL}
spring.security.oauth2.resourceserver.jwt.jws-algorithms=ES256
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPABASE_URL}/auth/v1
spring.security.oauth2.resourceserver.jwt.audiences=authenticated

# Subida de imágenes: el mayor límite de los buckets ("activos", 5 MB). El de
# Spring por defecto es 1 MB. Cada servicio revisa además su propio límite
# (la foto de perfil, 2 MB) con Imagenes.leer().
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Mercado Pago (Checkout Pro, cuenta de prueba). El ":" del final deja el
# valor vacío si falta en .env: la app arranca y solo fallan los pagos.
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
# A dónde vuelve el comprador después de pagar en Mercado Pago.
bidhouse.front-url=http://localhost:5173

# Blockchain (Sepolia): billetera, nodo y contrato RegistroBidHouse. Los crean
# los scripts de blockchain/ (bun run billetera / desplegar). Vacías = no se registra.
blockchain.private-key=${BLOCKCHAIN_PRIVATE_KEY:}
blockchain.rpc-url=${BLOCKCHAIN_RPC_URL:}
blockchain.contract-address=${BLOCKCHAIN_CONTRACT_ADDRESS:}

# Cierre automático de subastas vencidas cada minuto (Servicios/CierreSubastas).
bidhouse.cierre-automatico=true

spring.mvc.problemdetails.enabled=true
